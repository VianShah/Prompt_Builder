# Render Blueprint: one web service + one Postgres database.
# New → Blueprint → pick this repo. Fill the "sync: false" values when Render asks.
databases:
  - name: prompt-builder-db
    plan: basic-256mb          # free Postgres is deleted after 30 days; don't use it for real data
    databaseName: prompt_builder
    user: prompt_builder
    region: singapore

services:
  - type: web
    name: prompt-builder
    runtime: node
    region: singapore          # same region as the database
    plan: starter              # free web services sleep after 15 minutes idle
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: prompt-builder-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: BUILDER_USERS
        sync: false
        sync: false
        sync: false
      # Claude Sonnet 5.5 on Bedrock is the main model; GLM and Gemini are fallbacks.
      - key: AWS_BEARER_TOKEN_BEDROCK
        sync: false
      - key: BEDROCK_REGION
        value: ap-south-1
      - key: CLAUDE_MODEL
        value: global.anthropic.claude-sonnet-5-5
      - key: GEMINI_API_KEY
        sync: false
      - key: GLM_BEDROCK_API_KEY
        sync: false
      - key: LLM_ORDER
        value: claude,glm,gemini
      # Sarvam workspace (MCP sign-in reads/pushes prompts) and the Voice Agents API key (calls tab).
      - key: SARVAM_ORG_ID
        sync: false
      - key: SARVAM_WORKSPACE_ID
        sync: false
      - key: SARVAM_API_KEY
        sync: false
      # Module library: committed to this repo on the module-library branch.
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPO
        value: VianShah/Prompt_Builder
      - key: GITHUB_LIBRARY_BRANCH
        value: module-library
      # true: the engineer who builds an agent approves it. false: a second person must approve.
      - key: SELF_APPROVE
        value: "true"
      - key: SARVAM_PROMPT_PUSH
        value: manual
      - key: AWS_BEARER_TOKEN_BEDROCK
        sync: false
      - key: SARVAM_ORG_ID
        sync: false
      - key: SARVAM_WORKSPACE_ID
        sync: false
      - key: SARVAM_API_KEY
        sync: false
