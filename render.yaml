# Render Blueprint: one web service + one Postgres database.
# New → Blueprint → pick this repo. Fill the "sync: false" values when Render asks.
databases:
  - name: prompt-builder-db
    plan: basic-256mb          # free Postgres is deleted after 30 days; don't use it for real data
    databaseName: prompt_builder
    user: prompt_builder
    region: singapore

services:
  - type: web
    name: prompt-builder
    runtime: node
    region: singapore          # same region as the database; change both together if Kollect runs elsewhere
    plan: starter              # free web services sleep after 15 minutes idle
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: prompt-builder-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: BUILDER_USERS
        sync: false
      - key: KOLLECT_BASE_URL
        sync: false
      - key: KOLLECT_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GLM_BEDROCK_API_KEY
        sync: false
      - key: LLM_ORDER
        value: glm,gemini
      - key: SARVAM_PROMPT_PUSH
        value: manual
